[package]
name = "throat"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rocket = { version = "0.5.1", features = ["json", "secrets"] }
sqlx = { version = "0.7", features = ["macros", "migrate", "postgres", "runtime-tokio", "chrono"] }
chrono = {version = "0.4", features = ["serde"]}
rocket_db_pools = {version = "0.2", features = ["sqlx_postgres", "deadpool_redis"]}
rocket_dyn_templates = {version = "0.2", features = ["minijinja"]}
dotenv = "0.15.0"
serde_json = "1.0.137"
url = "2.5.4"
